services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: payment_gateway_app
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://pguser:pgpass@postgres:5432/payment_gateway
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pg_network

  postgres:
    image: postgres:16-alpine
    container_name: payment_gateway_db
    restart: always
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: payment_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pg_network

  redis:
    image: redis:7-alpine
    container_name: payment_gateway_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pg_network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: payment_gateway_nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
